<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tribe — Cat voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
a{color:#34D399}a:hover{color:#6EE7B7}
button,input{font-family:inherit;cursor:pointer}
@keyframes tr-fade{from{opacity:0}to{opacity:1}}
@keyframes tr-push{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes tr-step{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tr-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes tr-backdrop{from{opacity:0}to{opacity:1}}
@keyframes tr-toast{from{opacity:0;transform:translateY(-16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tr-banner{from{opacity:0;transform:translateY(-120%)}to{opacity:1;transform:none}}
@keyframes tr-pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes tr-pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes tr-flash{0%,100%{border-color:rgba(248,113,113,.35)}40%{border-color:rgba(248,113,113,1)}}
button,a{transition:transform 120ms ease,background-color 180ms ease,color 180ms ease,border-color 180ms ease,opacity 180ms ease}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition:none!important}}
@keyframes orb-breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.15)}}
@keyframes orb-spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.7);opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; animation: tr-fade 300ms ease-out both">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 0">
    <a href="CatChat.dc.html" aria-label="Close voice mode" style="width: 44px; height: 44px; border-radius: 22px; background: #141414; color: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span style="font-size: 14px; color: #A3A3A3">Cat · Sharp · Voice</span>
    <span style="width: 44px"></span>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 0 24px">
    <button onClick="{{advance}}" aria-label="{{orbLabel}}" style="position: relative; width: 240px; height: 240px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="position: absolute; inset: 20px; border-radius: 50%; border: 1px solid rgba(52,211,153,0.4); animation: ring 2.4s ease-out infinite; animation-play-state: {{ringPlay}}"></span>
      <span aria-hidden="true" style="position: absolute; inset: 20px; border-radius: 50%; border: 1px solid rgba(52,211,153,0.3); animation: ring 2.4s ease-out 1.2s infinite; animation-play-state: {{ringPlay}}"></span>
      <span style="transform: scale({{orbScale}}); transition: transform 400ms cubic-bezier(.2,.8,.2,1)"><span aria-hidden="true" style="position: relative; display: inline-block; width: 170px; height: 170px; border-radius: 50%; animation: orb-breathe 4s ease-in-out infinite; background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #D1FAE5 16%, #34D399 42%, #065F46 72%, #052016 100%); box-shadow: 0 0 85px rgba(52,211,153,0.35), inset 0 -14px 34px rgba(0,0,0,0.45); flex-shrink: 0"><span style="position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.35) 40deg, rgba(255,255,255,0) 90deg); animation: orb-spin 6s linear infinite; mix-blend-mode: overlay"></span></span></span>
    </button>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 5px; height: 48px"><span style="width: 4px; height: 14px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 900ms ease-in-out 0ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 26px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 800ms ease-in-out 70ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 38px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 1000ms ease-in-out 140ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 22px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 700ms ease-in-out 210ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 44px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 950ms ease-in-out 280ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 30px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 850ms ease-in-out 350ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 40px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 780ms ease-in-out 420ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 920ms ease-in-out 490ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 34px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 860ms ease-in-out 560ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 24px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 740ms ease-in-out 630ms infinite; animation-play-state: {{barPlay}}"></span><span style="width: 4px; height: 12px; border-radius: 2px; background: {{barColor}}; transform-origin: center; animation: wave 980ms ease-in-out 700ms infinite; animation-play-state: {{barPlay}}"></span></div>
    <div role="status" aria-live="polite" style="text-align: center; display: flex; flex-direction: column; gap: 10px; min-height: 110px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: {{phaseColor}}">{{phaseLabel}}</div>
      <div style="font-size: 20px; line-height: 1.4; color: #F5F5F5">{{line}}</div>
      <div style="font-size: 14px; color: #8A8A8A">{{hint}}</div>
    </div>
  </main>
  <div style="display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 24px 44px">
    <button onClick="{{toggleMute}}" aria-pressed="{{mutedSel}}" aria-label="{{muteLabel}}" style="width: 60px; height: 60px; border-radius: 30px; border: 0; display: flex; align-items: center; justify-content: center; background: {{muteBg}}; color: {{muteFg}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path d="{{muteSlash}}"/></svg></button>
    <a href="CatChat.dc.html" aria-label="End voice mode" style="width: 60px; height: 60px; border-radius: 30px; border: 0; display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 36px; background: #F87171; color: #2A0A0A"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <a href="CatChat.dc.html" aria-label="Switch to typing" style="width: 60px; height: 60px; border-radius: 30px; border: 0; display: flex; align-items: center; justify-content: center; background: #1A1A1A; color: #F5F5F5"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 0, muted: false }; }
  renderVals() {
    const st = this.state, p = st.p, m = st.muted;
    const P = [
      { label: 'LISTENING', color: '#34D399', line: '“buy fifty dollars of eth with a five percent stop…”', hint: 'Tap the orb when you’re done', scale: 1, play: 'running', bar: '#34D399' },
      { label: 'THINKING', color: '#FCD34D', line: 'Checking your limits and the ETH price…', hint: '', scale: 0.88, play: 'paused', bar: '#3A3A3A' },
      { label: 'CAT', color: '#F5F5F5', line: 'Bracket ready: $50 of ETH, stop at minus 5, target plus 12. Max loss two fifty. Say “confirm” to sign.', hint: 'Say “confirm”, or tap to interrupt', scale: 1.06, play: 'running', bar: '#F5F5F5' },
      { label: 'SIGNED', color: '#34D399', line: 'Done. It landed onchain. I’ll ping you if it hits the stop or the target.', hint: 'Tap to start again', scale: 1, play: 'paused', bar: '#3A3A3A' }
    ][p];
    return {
      phaseLabel: m && p === 0 ? 'MUTED' : P.label, phaseColor: m && p === 0 ? '#A3A3A3' : P.color, line: P.line, hint: P.hint,
      orbScale: String(P.scale), ringPlay: m ? 'paused' : P.play, barPlay: m ? 'paused' : P.play, barColor: m ? '#3A3A3A' : P.bar,
      orbLabel: ['Stop listening', 'Thinking', 'Interrupt Cat', 'Start again'][p], advance: () => this.setState({ p: (p + 1) % 4 }),
      mutedSel: m ? 'true' : 'false', muteLabel: m ? 'Unmute microphone' : 'Mute microphone', muteBg: m ? '#F5F5F5' : '#1A1A1A', muteFg: m ? '#0A0A0A' : '#F5F5F5', muteSlash: m ? 'M3 3l18 18' : 'M0 0', toggleMute: () => this.setState({ muted: !m })
    };
  }
}
</script>
</body>
</html>
